# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Render Blueprint for a short-lived SentinelAlpha demo environment.
# Free Render Postgres expires after 30 days; export any audit data you need.
services:
  - type: web
    name: sentinelalpha-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: API_AUTH_TOKEN
        generateValue: true
      - key: API_AUTH_ROLE
        value: operator
      - key: API_AUTH_USER_ID
        value: 00000000-0000-0000-0000-000000000001
      - key: API_AUTH_PORTFOLIO_ID
        value: 00000000-0000-0000-0000-000000000002
      - key: DATABASE_URL
        fromDatabase:
          name: sentinelalpha-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sentinelalpha-redis
          property: connectionString
      - key: REDIS_REQUIRED
        value: "true"
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      - key: WEB_ORIGIN
        fromService:
          type: web
          name: sentinelalpha-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER
        value: "true"
      - key: ALPACA_TRADING_API_URL
        value: https://paper-api.alpaca.markets/v2
      - key: ALPACA_DATA_FEED
        value: iex
      - key: ALPACA_OPTIONS_FEED
        value: indicative
      - key: ALPACA_OPTIONS_EXECUTION_ADAPTER
        value: cli
      - key: ALPACA_CLI_PATH
        value: alpaca
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: AUTO_EXECUTE_PAPER
        value: "false"

  - type: web
    name: sentinelalpha-web
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: apps/web
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_API_ORIGIN
        fromService:
          type: web
          name: sentinelalpha-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: keyvalue
    name: sentinelalpha-redis
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: "off"

databases:
  - name: sentinelalpha-postgres
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: sentinelalpha
    user: sentinelalpha
    ipAllowList: []
